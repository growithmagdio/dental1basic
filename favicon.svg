<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3857"/>
      <stop offset="100%" stop-color="#0E1B2A"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D4"/>
      <stop offset="45%" stop-color="#D7BA8C"/>
      <stop offset="100%" stop-color="#A88453"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Midnight Navy Shield -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favGold)" stroke-width="1.2" opacity="0.4"/>

  <!-- Centered Emblem -->
  <g transform="translate(10, 6)">
    <!-- Outer Arch & Root Curve 1 -->
    <path d="M22 6 C13 6 5 14 5 25 C5 34 12 40 16 48 C18 52 21 52 22 47 C23 41 23 34 23 29 C23 19 20 14 22 6 Z" 
          fill="url(#favGold)"/>
    <!-- Outer Arch & Root Curve 2 -->
    <path d="M22 6 C31 6 39 14 39 25 C39 34 32 40 28 48 C26 52 23 52 22 47 C21 41 21 34 21 29 C21 19 24 14 22 6 Z" 
          fill="url(#favGold)" opacity="0.9"/>
    <!-- Central Radiant Core -->
    <circle cx="22" cy="22" r="4.5" fill="#FFFFFF" filter="url(#favGlow)"/>
    <circle cx="22" cy="22" r="3" fill="url(#favGold)"/>
  </g>
</svg>
