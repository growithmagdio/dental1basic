<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" fill="none">
  <defs>
    <linearGradient id="lumoraGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D4"/>
      <stop offset="45%" stop-color="#D7BA8C"/>
      <stop offset="100%" stop-color="#B38F56"/>
    </linearGradient>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Arch & Root Curve 1 -->
    <path d="M22 6 C14 6 7 13 7 23 C7 31 13 36 17 44 C19 48 21 48 22 43 C23 37 23 31 23 27 C23 18 20 13 22 6 Z" 
          fill="url(#lumoraGoldLight)"/>
    <!-- Outer Arch & Root Curve 2 -->
    <path d="M22 6 C30 6 37 13 37 23 C37 31 31 36 27 44 C25 48 23 48 22 43 C21 37 21 31 21 27 C21 18 24 13 22 6 Z" 
          fill="url(#lumoraGoldLight)" opacity="0.9"/>
    <!-- Central Radiant Pearl -->
    <circle cx="22" cy="20" r="4.2" fill="#FFFFFF" filter="url(#softGlowLight)"/>
    <circle cx="22" cy="20" r="2.8" fill="url(#lumoraGoldLight)"/>
    <!-- Golden Halo Ring -->
    <ellipse cx="22" cy="24" rx="19" ry="19" stroke="url(#lumoraGoldLight)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.65"/>
  </g>

  <!-- Typography: LUMORA DENTAL STUDIO (Light Edition for Dark Backgrounds) -->
  <g transform="translate(68, 12)">
    <text x="0" y="22" font-family="'Cormorant Garamond', 'DM Serif Display', Georgia, serif" font-size="25" font-weight="600" letter-spacing="4.5" fill="#F7F5EF">
      LUMORA
    </text>
    <text x="1" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="4.8" fill="#D7BA8C">
      DENTAL STUDIO
    </text>
    <circle cx="168" cy="18" r="1.5" fill="#D7BA8C"/>
  </g>
</svg>
