<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" fill="none">
  <defs>
    <linearGradient id="lumoraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1B3"/>
      <stop offset="45%" stop-color="#C6A574"/>
      <stop offset="100%" stop-color="#9C7844"/>
    </linearGradient>
    <linearGradient id="lumoraNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3857"/>
      <stop offset="100%" stop-color="#0E1B2A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Arch & Root Curve 1 -->
    <path d="M22 6 C14 6 7 13 7 23 C7 31 13 36 17 44 C19 48 21 48 22 43 C23 37 23 31 23 27 C23 18 20 13 22 6 Z" 
          fill="url(#lumoraGold)"/>
    <!-- Outer Arch & Root Curve 2 (Symmetric Balance with Modern Aperture) -->
    <path d="M22 6 C30 6 37 13 37 23 C37 31 31 36 27 44 C25 48 23 48 22 43 C21 37 21 31 21 27 C21 18 24 13 22 6 Z" 
          fill="url(#lumoraGold)" opacity="0.85"/>
    <!-- Central Radiant Pearl / Core Flare -->
    <circle cx="22" cy="20" r="4.2" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="22" cy="20" r="2.8" fill="url(#lumoraGold)"/>
    <!-- Subtle Golden Halo Ring -->
    <ellipse cx="22" cy="24" rx="19" ry="19" stroke="url(#lumoraGold)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.5"/>
  </g>

  <!-- Typography: LUMORA DENTAL STUDIO (Navy Edition for Light & Glass Backgrounds) -->
  <g transform="translate(68, 12)">
    <text x="0" y="22" font-family="'Cormorant Garamond', 'DM Serif Display', Georgia, serif" font-size="25" font-weight="600" letter-spacing="4.5" fill="#172B42">
      LUMORA
    </text>
    <text x="1" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="4.8" fill="#C6A574">
      DENTAL STUDIO
    </text>
    <!-- Refined Architectural Dot Accent -->
    <circle cx="168" cy="18" r="1.5" fill="#C6A574"/>
  </g>
</svg>
